<!doctype html>
<html><head><meta charset="utf-8">
<style>
@page { size: 24in 12in; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 24in; height: 12in; }
body { background: #17131F; font-family: "Inter Display", "Inter", sans-serif; overflow: hidden; }
.sign { position: relative; width: 24in; height: 12in; display: flex; flex-direction: column; align-items: center; }
.logo { margin-top: 0.4in; height: 2.75in; }
h1 { margin-top: 0.1in; font-weight: 900; font-size: 2.45in; line-height: 1; letter-spacing: 0.01em; color: #FFD323; text-transform: uppercase; }
.bar { position: absolute; left: 0; right: 0; top: 6.3in; height: 3.4in; background: #E3261C;
       border-top: 0.1in solid #111014; border-bottom: 0.1in solid #111014;
       display: flex; align-items: center; justify-content: center; gap: 0.45in; color: #fff; }
.label { font-weight: 900; font-size: 0.62in; line-height: 1.05; text-align: right; text-transform: uppercase; }
.num { font-weight: 900; line-height: 1; white-space: nowrap; display: flex; align-items: baseline; gap: 0.22in; }
.area { font-size: 1.25in; }
.main { font-size: 2.45in; letter-spacing: 0.01em; }
.url { position: absolute; left: 0; right: 0; bottom: 0; height: 2.3in; display: flex; align-items: center; justify-content: center;
       font-weight: 800; font-size: 1.0in; color: #FFFFFF; }
</style></head>
<body><div class="sign">
  <img class="logo" src="../site/assets/logo-hero.webp" alt="Four Horsemen Comics">
  <h1>We buy comics</h1>
  <div class="bar">
    <div class="label">Call<br>or text</div>
    <div class="num"><span class="area">520</span><span class="main">272-3253</span></div>
  </div>
  <div class="url">FourHorsemenComics.net</div>
</div></body></html>
